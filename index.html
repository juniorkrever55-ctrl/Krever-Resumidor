<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consórcio — Resumo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem}
.container{background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:2rem;width:100%;max-width:720px;box-shadow:0 25px 60px rgba(0,0,0,0.35)}
h1{font-weight:800;font-size:1.8rem;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.25rem}
.subtitle{color:#94a3b8;font-size:0.9rem;margin-bottom:1.5rem}
label{font-weight:600;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;color:#94a3b8;margin-bottom:0.35rem;display:block}
textarea{width:100%;background:#0b1120;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:0.75rem;color:#f8fafc;font-family:inherit;font-size:0.95rem;resize:vertical;outline:none;transition:border-color .2s}
textarea:focus{border-color:#38bdf8}
button{width:100%;margin-top:1rem;padding:0.85rem;border:none;border-radius:12px;background:linear-gradient(90deg,#38bdf8,#818cf8);color:#0f172a;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .1s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(56,189,248,0.25)}
#r{margin-top:1rem;padding:1rem;background:#0b1120;border-radius:12px;border:1px solid rgba(255,255,255,0.08);min-height:120px;white-space:pre-wrap;font-size:0.9rem;line-height:1.45;color:#e2e8f0}
</style>
</head>
<body>
<div class="container">
  <h1>Resumo de Consórcio</h1>
  <div class="subtitle">Cole a conversa, edite o prompt e resuma com IA</div>

  <label for="texto">Conversa</label>
  <textarea id="texto" rows="7" placeholder="Cole aqui o texto da conversa de vendas..."></textarea>

  <label for="prompt">Prompt (edite se quiser)</label>
  <textarea id="prompt" rows="3">Resuma como relatório direto de vendas de consórcio apenas se houver dados (nome, CPF, valor, parcela, status). Se for conversa pessoal sem esses dados, responda apenas: "Conversação pessoal — sem dados de venda de consórcio." Do contrário, use formato direto: nome, CPF, renda, valor, parcela, status, próxima ação.</textarea>

  <button onclick="resumir()">Gerar Resumo</button>
  <div id="r"></div>
</div>
<script>
function resumir(){
  const p = document.getElementById('prompt').value;
  const t = document.getElementById('texto').value;
  document.getElementById('r').textContent = 'Processando...';
  fetch('/resumir?texto='+encodeURIComponent(p+'\n'+t))
    .then(r=>r.json()).then(j=>document.getElementById('r').textContent=j.resumo||JSON.stringify(j)).catch(e=>document.getElementById('r').textContent='Erro: '+e);
}
</script>

</html>
